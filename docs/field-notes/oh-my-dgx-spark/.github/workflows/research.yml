name: DGX Spark Research

on:
  schedule:
    # 10:17 KST on weekdays. The collector is cheap; Copilot runs only when candidates exist.
    - cron: "17 1 * * 1-5"
  workflow_dispatch:
    inputs:
      issue_number:
        description: "분석할 Issue 번호. 비워 두면 자동 검색을 실행합니다."
        required: false
        type: string
      force:
        description: "기존 보고서나 열린 PR이 있어도 다시 분석합니다."
        required: false
        default: false
        type: boolean
  issues:
    types:
      - labeled

permissions:
  contents: write
  issues: write
  pull-requests: write

concurrency:
  group: copilot-research-automation
  cancel-in-progress: false

env:
  COPILOT_CLI_VERSION: "1.0.80"

jobs:
  research:
    if: >-
      github.event_name != 'issues' ||
      github.event.label.name == 'research-ready'
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out the source repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"

      - name: Resolve the research Issue
        id: target
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          GITHUB_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          BRAVE_SEARCH_API_KEY: ${{ secrets.BRAVE_SEARCH_API_KEY }}
          X_BEARER_TOKEN: ${{ secrets.X_BEARER_TOKEN }}
          RESEARCH_MAX_CANDIDATES: ${{ vars.RESEARCH_MAX_CANDIDATES || '' }}
          EVENT_NAME: ${{ github.event_name }}
          EVENT_ISSUE_NUMBER: ${{ github.event.issue.number }}
          INPUT_ISSUE_NUMBER: ${{ inputs.issue_number }}
        run: |
          set -euo pipefail

          issue_number=""
          if [[ "${EVENT_NAME}" == "issues" ]]; then
            issue_number="${EVENT_ISSUE_NUMBER}"
          elif [[ -n "${INPUT_ISSUE_NUMBER}" ]]; then
            issue_number="${INPUT_ISSUE_NUMBER}"
          else
            candidates_file="${RUNNER_TEMP}/research-candidates.json"
            body_file="${RUNNER_TEMP}/research-issue.md"
            comments_dir="${RUNNER_TEMP}/research-issue-comments"
            discover_args=(
              --config research/sources.json
              --output "${candidates_file}"
            )
            if [[ -n "${RESEARCH_MAX_CANDIDATES:-}" ]]; then
              discover_args+=(--max-candidates "${RESEARCH_MAX_CANDIDATES}")
            fi
            python3 tools/research_discover.py "${discover_args[@]}"

            candidate_count="$(python3 - "${candidates_file}" <<'PY'
          import json
          import sys
          with open(sys.argv[1], encoding="utf-8") as handle:
              print(json.load(handle).get("candidate_count", 0))
          PY
            )"
            if [[ "${candidate_count}" == "0" ]]; then
              echo "No new research candidates."
              echo "has_issue=false" >> "${GITHUB_OUTPUT}"
              exit 0
            fi

            python3 tools/render_research_issue.py \
              "${candidates_file}" \
              "${body_file}" \
              --comments-dir "${comments_dir}"
            issue_url="$(gh issue create \
              --repo "${GH_REPO}" \
              --title "[Research] DGX Spark 자동 수집 $(date -u +%F) (${candidate_count}건)" \
              --body-file "${body_file}" \
              --label research-candidate)"
            issue_number="${issue_url##*/}"

            shopt -s nullglob
            comment_files=("${comments_dir}"/part-*.md)
            shopt -u nullglob
            if ((${#comment_files[@]} == 0)); then
              echo "::error::No rendered candidate comment parts were found."
              exit 1
            fi
            for index in "${!comment_files[@]}"; do
              echo "Posting candidate comment part $((index + 1))/${#comment_files[@]}."
              gh issue comment "${issue_number}" \
                --repo "${GH_REPO}" \
                --body-file "${comment_files[index]}"
            done
            gh issue comment "${issue_number}" \
              --repo "${GH_REPO}" \
              --body "자동 수집 후보를 만들었습니다. 새 후보가 있으므로 AIC 상한을 적용한 Copilot 1차 분석을 시작합니다."
          fi

          if [[ ! "${issue_number}" =~ ^[0-9]+$ ]]; then
            echo "::error::Could not resolve a numeric research Issue number."
            exit 1
          fi
          echo "issue_number=${issue_number}" >> "${GITHUB_OUTPUT}"
          echo "has_issue=true" >> "${GITHUB_OUTPUT}"

      - name: Skip duplicate analysis
        id: duplicate
        if: steps.target.outputs.has_issue == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          ISSUE_NUMBER: ${{ steps.target.outputs.issue_number }}
          EVENT_NAME: ${{ github.event_name }}
          INPUT_FORCE: ${{ inputs.force || false }}
        run: |
          set -euo pipefail
          if [[ "${EVENT_NAME}" == "workflow_dispatch" && "${INPUT_FORCE}" == "true" ]]; then
            echo "강제 재분석을 요청했습니다."
            echo "should_run=true" >> "${GITHUB_OUTPUT}"
            exit 0
          fi

          existing_report="$(git ls-files "docs/research-issue-${ISSUE_NUMBER}_*.md" | head -n 1)"
          open_pr="$(gh pr list \
            --repo "${GH_REPO}" \
            --state open \
            --limit 100 \
            --json headRefName,url \
            --jq "[.[] | select(.headRefName | startswith(\"research/issue-${ISSUE_NUMBER}-\"))][0].url // empty")"
          if [[ -n "${existing_report}" || -n "${open_pr}" ]]; then
            echo "기존 분석을 확인해 LLM 호출을 생략합니다."
            [[ -n "${existing_report}" ]] && echo "기존 보고서: ${existing_report}"
            [[ -n "${open_pr}" ]] && echo "열린 PR: ${open_pr}"
            echo "should_run=false" >> "${GITHUB_OUTPUT}"
            exit 0
          fi
          echo "should_run=true" >> "${GITHUB_OUTPUT}"

      - name: Check Copilot credential
        id: copilot_auth
        if: >-
          steps.target.outputs.has_issue == 'true' &&
          steps.duplicate.outputs.should_run == 'true'
        env:
          COPILOT_GITHUB_TOKEN: ${{ secrets.COPILOT_GITHUB_TOKEN }}
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          ISSUE_NUMBER: ${{ steps.target.outputs.issue_number }}
        run: |
          set -euo pipefail
          if [[ -z "${COPILOT_GITHUB_TOKEN:-}" ]]; then
            gh issue comment "${ISSUE_NUMBER}" \
              --repo "${GH_REPO}" \
              --body "Copilot 분석을 보류했습니다. COPILOT_GITHUB_TOKEN Actions Secret을 등록한 뒤 research-ready 라벨을 다시 추가해 주세요."
            echo "has_token=false" >> "${GITHUB_OUTPUT}"
            exit 0
          fi
          echo "has_token=true" >> "${GITHUB_OUTPUT}"

      - name: Set up Node.js
        if: steps.copilot_auth.outputs.has_token == 'true'
        uses: actions/setup-node@v7
        with:
          node-version: "22"

      - name: Install GitHub Copilot CLI
        if: steps.copilot_auth.outputs.has_token == 'true'
        run: |
          npm install --global "@github/copilot@${COPILOT_CLI_VERSION}"
          copilot --version

      - name: Prepare the analysis branch and prompt
        id: prepare
        if: steps.copilot_auth.outputs.has_token == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          ISSUE_NUMBER: ${{ steps.target.outputs.issue_number }}
          RESEARCH_MODEL: ${{ vars.RESEARCH_MODEL || 'gpt-5.6-terra' }}
        run: |
          set -euo pipefail
          branch="research/issue-${ISSUE_NUMBER}-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          git checkout -b "${branch}"
          echo "branch=${branch}" >> "${GITHUB_OUTPUT}"
          gh issue view "${ISSUE_NUMBER}" \
            --repo "${GH_REPO}" \
            --json number,title,body,comments,labels,url \
            > "${RUNNER_TEMP}/research-issue.json"

          research_date="$(TZ=Asia/Seoul date +%F)"
          report_path="docs/research-issue-${ISSUE_NUMBER}_${research_date}.md"
          python3 tools/render_research_report.py \
            --issue-json "${RUNNER_TEMP}/research-issue.json" \
            --output "${report_path}" \
            --research-date "${research_date}" \
            --model "${RESEARCH_MODEL}" \
            --if-missing
          echo "research_date=${research_date}" >> "${GITHUB_OUTPUT}"
          report_sha256="$(sha256sum "${report_path}" | cut -d ' ' -f 1)"
          echo "report_sha256=${report_sha256}" >> "${GITHUB_OUTPUT}"
          python3 - "${RUNNER_TEMP}/research-issue.json" "${RUNNER_TEMP}/research-prompt.md" "${ISSUE_NUMBER}" "${research_date}" <<'PY'
          import json
          import sys
          from pathlib import Path

          issue_path, prompt_path, issue_number, research_date = sys.argv[1:]
          base = Path("prompts/research-issue.md").read_text(encoding="utf-8")
          korean_style = Path("prompts/fluent-korean.md").read_text(encoding="utf-8")
          issue = json.loads(Path(issue_path).read_text(encoding="utf-8"))
          prompt = (
              base
              + "\n\n## Korean writing style\n\n"
              + korean_style
              + "\n\n## Issue number\n\n"
              + issue_number
              + "\n\n## Research date\n\n"
              + research_date
              + "\n\n## Required detailed document path\n\n"
              + f"`docs/research-issue-{issue_number}_{research_date}.md`\n"
              + "\n\n## Issue JSON\n\n```json\n"
              + json.dumps(issue, ensure_ascii=False, indent=2)
              + "\n```\n"
          )
          Path(prompt_path).write_text(prompt, encoding="utf-8")
          PY

      - name: Run the selected Copilot model
        if: steps.copilot_auth.outputs.has_token == 'true'
        env:
          COPILOT_GITHUB_TOKEN: ${{ secrets.COPILOT_GITHUB_TOKEN }}
          GH_TOKEN: ${{ github.token }}
          ISSUE_NUMBER: ${{ steps.target.outputs.issue_number }}
          RESEARCH_DATE: ${{ steps.prepare.outputs.research_date }}
          RESEARCH_MODEL: ${{ vars.RESEARCH_MODEL || 'gpt-5.6-terra' }}
          RESEARCH_EFFORT: ${{ vars.RESEARCH_EFFORT || 'medium' }}
          RESEARCH_MAX_AI_CREDITS: ${{ vars.RESEARCH_MAX_AI_CREDITS || '30' }}
          INITIAL_REPORT_SHA256: ${{ steps.prepare.outputs.report_sha256 }}
        run: |
          set -euo pipefail
          if [[ ! "${RESEARCH_MAX_AI_CREDITS}" =~ ^[0-9]+$ ]] || \
            ((RESEARCH_MAX_AI_CREDITS < 30 || RESEARCH_MAX_AI_CREDITS > 60)); then
            echo "::error::RESEARCH_MAX_AI_CREDITS는 30 이상 60 이하의 정수여야 합니다."
            exit 1
          fi
          echo "Copilot 실행 정책: role=research-draft, model=${RESEARCH_MODEL}, effort=${RESEARCH_EFFORT}, max_ai_credits=${RESEARCH_MAX_AI_CREDITS}"
          output_file="${RUNNER_TEMP}/copilot-research-output.md"
          prompt_file="${RUNNER_TEMP}/research-prompt.md"
          copilot_args=(
            -s
            -p "Use the view tool to read the complete research task from ${prompt_file}. Follow every instruction in that file and complete the required report before responding."
            --add-dir "${RUNNER_TEMP}"
            --model "${RESEARCH_MODEL}"
            --max-ai-credits "${RESEARCH_MAX_AI_CREDITS}"
            --no-ask-user
            --no-auto-update
            --no-color
            --no-custom-instructions
            --no-remote
            --no-remote-export
            --log-level error
            --secret-env-vars "COPILOT_GITHUB_TOKEN"
            "--available-tools=view,edit,create,apply_patch,glob,grep,web_fetch"
            "--allow-tool=read,write,url"
            "--deny-tool=shell"
          )
          if [[ "${RESEARCH_MODEL}" != "auto" && -n "${RESEARCH_EFFORT}" ]]; then
            copilot_args+=(--effort "${RESEARCH_EFFORT}")
          fi
          for domain in \
            "https://github.com" \
            "https://raw.githubusercontent.com" \
            "https://api.github.com" \
            "https://www.reddit.com" \
            "https://reddit.com" \
            "https://forums.developer.nvidia.com" \
            "https://www.nvidia.com" \
            "https://docs.nvidia.com" \
            "https://developer.nvidia.com" \
            "https://huggingface.co" \
            "https://arca.live" \
            "https://x.com" \
            "https://nacyot.github.io"; do
            copilot_args+=("--allow-url=${domain}")
          done

          if ! env -u GH_TOKEN -u GITHUB_TOKEN \
            copilot "${copilot_args[@]}" > "${output_file}" 2>&1; then
            python3 tools/redact_sensitive_output.py "${output_file}" --max-chars 6000
            gh issue comment "${ISSUE_NUMBER}" \
              --repo "${GITHUB_REPOSITORY}" \
              --body "Copilot 1차 분석에 실패했습니다. 인증정보와 원시 출력은 Issue에 게시하지 않았습니다. 실행 로그: https://github.com/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
            exit 1
          fi
          python3 tools/redact_sensitive_output.py "${output_file}" --in-place

          report_path="docs/research-issue-${ISSUE_NUMBER}_${RESEARCH_DATE}.md"
          if [[ ! -f "${report_path}" ]]; then
            echo "::error::Copilot CLI completed without leaving the required report: ${report_path}"
            exit 1
          fi
          current_report_sha256="$(sha256sum "${report_path}" | cut -d ' ' -f 1)"
          if [[ "${current_report_sha256}" == "${INITIAL_REPORT_SHA256}" ]]; then
            {
              echo "### Copilot 리서치 실행 실패"
              echo
              echo "Copilot CLI는 정상 종료했지만 리서치 보고서를 수정하지 않았습니다."
              echo "프롬프트 첨부와 파일 도구 설정을 확인해야 합니다."
            } >> "${GITHUB_STEP_SUMMARY}"
            gh issue comment "${ISSUE_NUMBER}" \
              --repo "${GITHUB_REPOSITORY}" \
              --body "Copilot CLI는 정상 종료했지만 리서치 보고서를 수정하지 않았습니다. 원시 출력과 인증정보는 게시하지 않았습니다. 실행 로그: https://github.com/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
            echo "::error::Copilot CLI completed without updating the required research report."
            exit 1
          fi

          output_bytes="$(wc -c < "${output_file}")"
          {
            echo "### Copilot 리서치 실행"
            echo
            echo "- 모델: \`${RESEARCH_MODEL}\`"
            echo "- effort: \`${RESEARCH_EFFORT}\`"
            echo "- 세션 AIC soft cap: \`${RESEARCH_MAX_AI_CREDITS}\`"
            echo "- 최종 응답 크기: \`${output_bytes}\` bytes"
          } >> "${GITHUB_STEP_SUMMARY}"

          python3 - "${output_file}" "${RUNNER_TEMP}/research-comment.md" <<'PY'
          import sys
          from pathlib import Path

          text = Path(sys.argv[1]).read_text(encoding="utf-8", errors="replace")
          limit = 12000
          if len(text) > limit:
              text = text[:limit] + "\n\n_(분석 댓글은 요약 길이 제한으로 잘렸습니다. 전체 제안은 draft PR의 문서를 확인하세요.)_"
          Path(sys.argv[2]).write_text(
              "## Copilot 리서치 분석\n\n" + text + "\n",
              encoding="utf-8",
          )
          PY

      - name: Comment the analysis on the Issue
        if: steps.copilot_auth.outputs.has_token == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          ISSUE_NUMBER: ${{ steps.target.outputs.issue_number }}
        run: gh issue comment "${ISSUE_NUMBER}" --repo "${GH_REPO}" --body-file "${RUNNER_TEMP}/research-comment.md"

      - name: Restore deterministic research metadata
        if: steps.copilot_auth.outputs.has_token == 'true'
        env:
          ISSUE_NUMBER: ${{ steps.target.outputs.issue_number }}
          RESEARCH_DATE: ${{ steps.prepare.outputs.research_date }}
          RESEARCH_MODEL: ${{ vars.RESEARCH_MODEL || 'gpt-5.6-terra' }}
        run: |
          set -euo pipefail
          report="docs/research-issue-${ISSUE_NUMBER}_${RESEARCH_DATE}.md"
          python3 tools/normalize_research_report.py \
            --report "${report}" \
            --issue-json "${RUNNER_TEMP}/research-issue.json" \
            --issue-number "${ISSUE_NUMBER}" \
            --research-date "${RESEARCH_DATE}" \
            --model "${RESEARCH_MODEL}"

      - name: Remove changes outside research scope
        if: steps.copilot_auth.outputs.has_token == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          ISSUE_NUMBER: ${{ steps.target.outputs.issue_number }}
          RESEARCH_DATE: ${{ steps.prepare.outputs.research_date }}
        run: |
          set -euo pipefail
          today="${RESEARCH_DATE}"
          expected_doc="docs/research-issue-${ISSUE_NUMBER}_${today}.md"

          forbidden=()
          while IFS= read -r changed; do
            if [[ "${changed}" == "${expected_doc}" || \
              "${changed}" == research/drafts/*.md || \
              -z "${changed}" ]]; then
              continue
            fi
            forbidden+=("${changed}")
          done < <(
            {
              git diff --name-only HEAD
              git ls-files --others --exclude-standard
            } | sort -u
          )

          if ((${#forbidden[@]} == 0)); then
            exit 0
          fi

          tracked_forbidden=()
          untracked_forbidden=()
          for changed in "${forbidden[@]}"; do
            if git ls-files --error-unmatch -- "${changed}" >/dev/null 2>&1; then
              tracked_forbidden+=("${changed}")
            else
              untracked_forbidden+=("${changed}")
            fi
          done
          if ((${#tracked_forbidden[@]} > 0)); then
            git restore --source=HEAD --staged --worktree -- "${tracked_forbidden[@]}"
          fi
          if ((${#untracked_forbidden[@]} > 0)); then
            rm -- "${untracked_forbidden[@]}"
          fi
          {
            echo "자동 리서치가 허용 범위 밖의 안정 파일을 수정해 워크플로가 원복했습니다."
            echo
            echo "원복된 파일:"
            printf -- '- `%s`\n' "${forbidden[@]}"
            echo
            echo "안정 챕터 승격은 별도 검토 PR에서 진행합니다."
          } > "${RUNNER_TEMP}/research-scope-comment.md"
          gh issue comment "${ISSUE_NUMBER}" \
            --repo "${GH_REPO}" \
            --body-file "${RUNNER_TEMP}/research-scope-comment.md"

      - name: Validate the proposed diff
        if: steps.copilot_auth.outputs.has_token == 'true'
        env:
          ISSUE_NUMBER: ${{ steps.target.outputs.issue_number }}
          RESEARCH_DATE: ${{ steps.prepare.outputs.research_date }}
        run: |
          set -euo pipefail
          today="${RESEARCH_DATE}"
          expected_doc="docs/research-issue-${ISSUE_NUMBER}_${today}.md"
          while IFS= read -r changed; do
            if [[ -z "${changed}" || \
              "${changed}" == "${expected_doc}" || \
              "${changed}" == research/drafts/*.md || \
              -z "${changed}" ]]; then
              continue
            fi
            echo "::error::Research agent changed a forbidden path: ${changed}"
            exit 1
          done < <(git status --porcelain=v1 | sed -E 's/^.. //')

          if [[ ! -f "${expected_doc}" ]]; then
            echo "::error::Missing dated research document: ${expected_doc}"
            exit 1
          fi

          python3 tools/check_research_report.py "${expected_doc}" \
            --issue-number "${ISSUE_NUMBER}" \
            --research-date "${today}"

          # Book and research pages may use Markdown's two-space hard-break
          # syntax. Keep the diagnostic, but do not block the draft PR on it.
          if ! git diff --check; then
            echo "::warning::Markdown whitespace diagnostics found; continuing because the generated content is reviewed in the draft PR."
          fi

      - name: Create a draft research PR
        if: steps.copilot_auth.outputs.has_token == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          ISSUE_NUMBER: ${{ steps.target.outputs.issue_number }}
          RESEARCH_DATE: ${{ steps.prepare.outputs.research_date }}
          RESEARCH_BRANCH: ${{ steps.prepare.outputs.branch }}
        run: |
          set -euo pipefail
          git add docs research
          if git diff --cached --quiet; then
            gh issue comment "${ISSUE_NUMBER}" \
              --repo "${GH_REPO}" \
              --body "분석은 완료됐지만 책에 반영할 파일 변경은 만들지 않았습니다. 근거 부족 또는 재현 대기 상태일 수 있습니다."
            exit 0
          fi

          report_path="docs/research-issue-${ISSUE_NUMBER}_${RESEARCH_DATE}.md"
          public_report_path="appendix-b-research-issue-${ISSUE_NUMBER}_${RESEARCH_DATE}.md"
          pr_title="[Research] Issue #${ISSUE_NUMBER} DGX Spark 분석 (${RESEARCH_DATE})"
          pr_body="## 자동 리서치 제안

          원본 Issue: [#${ISSUE_NUMBER}](https://github.com/${GH_REPO}/issues/${ISSUE_NUMBER})

          ### 이번 PR

          - 날짜별 원문: \`${report_path}\`
          - 머지 후 WikiDocs 공개 파일: \`wikidocs/pages/${public_report_path}\`
          - Issue 본문·댓글과 허용된 원문 URL을 바탕으로 후보 자료를 분류했습니다.
          - 공식 자료, 직접 측정, 커뮤니티 보고, 재현 대기 항목을 구분했습니다.
          - 안정된 \`book/\` 본문은 자동으로 수정하지 않았습니다.

          ### 검토할 항목

          - 각 수치의 모델 revision, quant, runtime, 노드 수, context, 동시성, 측정 방법
          - 출처 유형과 원문 링크
          - 재현 대기 항목이 확정형으로 쓰이지 않았는지
          - 본문 승격이 필요한 내용은 별도 PR로 분리했는지

          ### WikiDocs 반영

          이 PR을 머지하면 \`Publish WikiDocs\`가 \`docs/\` 원문을 기준으로 부록 B의 날짜별 공개 서브챕터와 \`TOC.md\` 항목을 생성합니다. 원문을 삭제하면 다음 export에서 대응 페이지와 TOC 항목도 제거됩니다.

          자동 분석 초안이므로 출처·조건·수치를 사람이 최종 검토한 뒤 머지해 주세요."
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "research: analyze issue #${ISSUE_NUMBER}"
          git push --set-upstream origin "${RESEARCH_BRANCH}"

          pr_url="$(gh pr create \
            --repo "${GH_REPO}" \
            --draft \
            --base main \
            --head "${RESEARCH_BRANCH}" \
            --title "${pr_title}" \
            --body "${pr_body}")"
          pr_number="${pr_url##*/}"
          gh api --method POST "repos/${GH_REPO}/issues/${pr_number}/labels" \
            -f 'labels[]=research-pr'
          gh issue comment "${ISSUE_NUMBER}" \
            --repo "${GH_REPO}" \
            --body "초안 PR을 만들었습니다: ${pr_url}"
          gh issue edit "${ISSUE_NUMBER}" \
            --repo "${GH_REPO}" \
            --add-label research-pr
