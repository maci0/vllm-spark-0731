name: Refresh Search Endpoints

on:
  schedule:
    # 10:05 KST on weekdays, before the daily research run.
    - cron: "5 1 * * 1-5"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: refresh-search-endpoints
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out the source repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"

      - name: Prepare the endpoint refresh branch
        env:
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          branch="automation/search-endpoints"
          if git ls-remote --exit-code origin "refs/heads/${branch}" >/dev/null 2>&1; then
            git fetch origin "${branch}"
            git switch --create "${branch}" --track "origin/${branch}"
          else
            git switch --create "${branch}"
          fi

      - name: Validate the configured search endpoint list
        env:
          SEARCH_URL: ${{ secrets.SEARCH_URL || '' }}
          SEARCH_URLS: ${{ secrets.SEARCH_URLS || '' }}
          SEARCH_API_KEY: ${{ secrets.SEARCH_API_KEY || '' }}
        run: |
          set -euo pipefail
          output_file="research/search-endpoints.json"
          if [[ -n "${SEARCH_URL:-}" || -n "${SEARCH_URLS:-}" ]]; then
            output_file="${RUNNER_TEMP}/search-endpoints.json"
          fi
          python3 tools/refresh_search_endpoints.py \
            --config research/source-discovery.json \
            --cache research/search-endpoints.json \
            --output "${output_file}"

      - name: Stop when the reflected list did not change
        id: changes
        run: |
          set -euo pipefail
          if [[ -z "$(git status --short --untracked-files=all -- research/search-endpoints.json)" ]]; then
            echo "changed=false" >> "${GITHUB_OUTPUT}"
            echo "검색 엔드포인트 목록에 반영할 변경이 없습니다."
            exit 0
          fi
          echo "changed=true" >> "${GITHUB_OUTPUT}"

      - name: Create or update the endpoint-list PR
        if: steps.changes.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add research/search-endpoints.json
          git commit -m "chore: refresh search endpoint cache"
          git push --set-upstream origin automation/search-endpoints

          python3 - "${RUNNER_TEMP}/endpoint-pr-body.md" <<'PY'
          import json
          import sys
          from pathlib import Path

          cache = json.loads(Path("research/search-endpoints.json").read_text(encoding="utf-8"))
          lines = [
              "## 변경 내용",
              "",
              "공개 검색 인스턴스 전체 목록을 다시 확인하고 실제 `format=json` 검색 요청을 통과한 주소만 반영했습니다.",
              "",
              f"- 후보 인스턴스: {cache.get('candidate_count', 0)}개",
              f"- 실제 검사: {cache.get('probed_count', 0)}개",
              f"- 반영 주소: {len(cache.get('endpoints', []))}개",
              f"- 생성 시각: `{cache.get('generated_at', '')}`",
              "",
              "## 이번에 반영될 검색 주소",
              "",
          ]
          endpoints = cache.get("endpoints", [])
          if endpoints:
              lines.extend(f"- `{item.get('url', '')}`" for item in endpoints)
          else:
              lines.append("- 정상 응답 주소 없음. 기존 캐시를 유지합니다.")
          lines += [
              "",
              "이 파일은 승인된 출처 목록이 아니라 검색 인스턴스의 last-known-good 캐시입니다.",
              "매일 갱신하지만 주소 집합이 바뀔 때만 이 PR을 갱신합니다.",
              "",
              "검토 후 머지하면 다음 리서치 실행부터 이 목록을 fallback으로 사용합니다.",
          ]
          Path(sys.argv[1]).write_text("\n".join(lines) + "\n", encoding="utf-8")
          PY

          gh label create research-infrastructure \
            --repo "${GH_REPO}" \
            --color "5319e7" \
            --description "리서치 실행 기반과 검색 엔드포인트 변경" \
            --force >/dev/null 2>&1 || true
          open_pr="$(gh pr list \
            --repo "${GH_REPO}" \
            --head automation/search-endpoints \
            --state open \
            --json url \
            --jq '.[0].url // empty')"
          if [[ -n "${open_pr}" ]]; then
            gh pr comment "${open_pr}" \
              --repo "${GH_REPO}" \
              --body-file "${RUNNER_TEMP}/endpoint-pr-body.md"
            echo "기존 엔드포인트 PR을 갱신했습니다: ${open_pr}"
          else
            gh pr create \
              --repo "${GH_REPO}" \
              --base main \
              --head automation/search-endpoints \
              --title "chore: refresh search endpoint cache" \
              --body-file "${RUNNER_TEMP}/endpoint-pr-body.md" \
              --label research-infrastructure
          fi
