# LMCache GDS on Spark UMA (docs/PLAN-MAIN.md phase 6).
# CPU RAM offload is the same 128 GiB pool. Keep it off.
# LMCache git dev uses gds_buffer_size (MiB), not cufile_buffer_size.
# 2048 MiB is UMA. Drop this if GPU KV tokens fall below the eager baseline.

local_cpu: false
max_local_cpu_size: 0
chunk_size: 256
gds_path: /mnt/nvme/lmcache-0731
gds_buffer_size: 2048
use_gds: true
gds_backend: cufile
